# Build the static site and publish it to GitHub Pages on every push to main.
#
# `npm run build` first mirrors webR's R packages (npm run assets), then checks
# every track inside webR (npm run content: a failing content check fails the
# deploy), then builds under /<repo-name>/. Pages can't send the COOP/COEP
# headers webR's fast channel needs; the app's service worker adds them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache the mirrored R packages
        uses: actions/cache@v4
        with:
          path: static/webr-repo
          key: webr-repo-${{ hashFiles('r-packages.json', 'package-lock.json') }}

      - run: npm ci

      - name: Fetch webR packages, check the content in webR, build the site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
