- id: pd-hours-predict
  tier: warm-up
  type: predict
  skill: dd-duration
  prompt: "What does this return?"
  code: |
    as.numeric(ddays(1) + dhours(12), "hours")
  options: ["36", "1.5", "129600"]
  verify: 'as.character(result)'
  explain: "Durations add as seconds: 86,400 + 43,200 = 129,600 seconds. as.numeric() with a unit converts them: 36 hours."

- id: pd-next-week
  tier: warm-up
  type: write
  skill: dd-period
  data: flights
  prompt: "Add next_week: each flight's time_hour one week later, at the same clock time."
  hint: "Same clock time means a period: weeks() or days(), not dweeks()."
  solution: |
    flights |>
      mutate(next_week = time_hour + weeks(1))

- id: pd-land-est
  tier: core
  type: write
  skill: dd-duration
  data: flights
  prompt: "air_time is the time in the air, in minutes. Add land_est: time_hour plus air_time as an exact duration."
  hint: "dminutes() turns a number of minutes into a duration."
  solution: |
    flights |>
      mutate(land_est = time_hour + dminutes(air_time))

- id: pd-fix-year
  tier: core
  type: fix
  skill: dd-period
  data: flights
  prompt: >-
    This should count the flights on each date and add the same date one
    year later, but next_year comes out as a date-time at 06:00. Fix it.
  hint: "dyears(1) is 365.25 days. Which kind of span means \"same date next year\"?"
  starter: |
    flights |>
      count(date = make_date(year, month, day)) |>
      mutate(next_year = date + dyears(1))
  solution: |
    flights |>
      count(date = make_date(year, month, day)) |>
      mutate(next_year = date + years(1))

- id: pd-renewal
  tier: core
  type: write
  skill: dd-month-end
  data: flights
  prompt: >-
    Count the flights on each date (built from year, month and day), then add
    renewal: the same day one month later, or the last day of that month
    when the day doesn't exist (31 January renews on 28 February). No NAs.
  hint: "%m+% months(1) rolls back to the end of the month instead of giving NA."
  solution: |
    flights |>
      count(date = make_date(year, month, day)) |>
      mutate(renewal = date %m+% months(1))

- id: pd-0130-predict
  tier: stretch
  type: predict
  skill: dd-dst
  prompt: "New York's clocks jumped from 2 am to 3 am on 8 March 2026. What clock time does this return?"
  code: |
    ymd_hms("2026-03-07 01:30:00", tz = "America/New_York") + ddays(1)
  options: ["2026-03-08 01:30", "2026-03-08 02:30", "2026-03-08 00:30"]
  verify: 'format(result, "%Y-%m-%d %H:%M")'
  explain: "86,400 seconds after 01:30 on 7 March is 01:30 on 8 March, half an hour before the jump at 2:00. The span doesn't cross the change, so the duration and days(1) agree."

- id: pd-bill-count
  tier: stretch
  type: write
  skill: dd-month-end
  data: flights
  prompt: >-
    Each flight is billed one month after its date (built from year, month
    and day), on the last day of the month when that day doesn't exist.
    Count the flights per bill_date.
  hint: "make_date(...) %m+% months(1) inside count(). 29, 30 and 31 January all bill on 28 February."
  solution: |
    flights |>
      count(bill_date = make_date(year, month, day) %m+% months(1))

- id: pd-dst-flights
  tier: brain-melter
  type: write
  skill: dd-dst
  data: flights
  prompt: >-
    For some flights, "same clock time tomorrow" and "24 hours later" are
    different moments. Count those flights per date: columns month, day
    and n.
  hint: "Compare time_hour + days(1) with time_hour + ddays(1)."
  solution: |
    flights |>
      filter(time_hour + days(1) != time_hour + ddays(1)) |>
      count(month, day)
