data: 'tibble(text = c("01/02/2026", "03/04/2026", "12/11/2026"))'
steps:
  - code: ""
    show: 'c("01/02/2026", "03/04/2026", "12/11/2026")'
    caption: "Three dates written as text. Sorted as text, \"12/11\" comes after \"03/04\", but nothing here is a date yet."
  - code: "mutate(as_mdy = mdy(text))"
    show: "mdy(text)"
    caption: "mdy() reads month, day, year: 2 January, 4 March, 11 December."
    skill: dt-parse
  - code: "mutate(as_dmy = dmy(text))"
    show: "dmy(text)"
    caption: "dmy() reads the same text as day, month, year: 1 February, 3 April, 12 November. Only you know which one the file meant."
  - code: "mutate(weekday = wday(as_mdy, label = TRUE))"
    show: "wday(as_mdy, label = TRUE)"
    caption: "Once parsed, dates come apart: wday() gives the day of the week."
    skill: dt-components
  - code: 'mutate(plus_month = as_mdy + months(1))'
    show: "as_mdy + months(1)"
    caption: "A period of one month keeps the day of the month: 2 February, 4 April, 11 January 2027."
    skill: dt-arith
