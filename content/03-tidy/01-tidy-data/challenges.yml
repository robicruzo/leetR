- id: tidy-rate
  tier: warm-up
  type: write
  skill: td-why
  data: table1
  prompt: "From table1, add rate: cases per 10,000 people."
  hint: "cases and population are both columns, so divide one by the other."
  solution: |
    table1 |>
      mutate(rate = cases / population * 10000)

- id: tidy-count-rows
  tier: warm-up
  type: predict
  skill: td-rules
  data: table2
  prompt: "table2 holds 3 countries over 2 years, with cases and population in one count column. What does this return?"
  code: |
    table2 |>
      count(country)
  options: ["3 rows, n = 4", "3 rows, n = 2", "6 rows, n = 2"]
  verify: 'paste(nrow(result), "rows, n =", paste(unique(result$n), collapse = "/"))'
  explain: "count() counts rows, and a row of table2 is half an observation: each country has 2 years × 2 types = 4 rows."

- id: tidy-population-rows
  tier: core
  type: write
  skill: td-spot
  data: table2
  prompt: "From table2, keep only the population numbers, as columns country, year and population."
  hint: "The variable name sits in type. Keep the right rows, then rename count while selecting."
  solution: |
    table2 |>
      filter(type == "population") |>
      select(country, year, population = count)

- id: tidy-fix-total
  tier: core
  type: fix
  skill: td-spot
  data: table2
  prompt: "This should total the cases per country across both years, but the totals are in the billions. Fix it."
  hint: "What else is in the count column besides cases?"
  starter: |
    table2 |>
      summarise(cases = sum(count), .by = country)
  solution: |
    table2 |>
      filter(type == "cases") |>
      summarise(cases = sum(count), .by = country)

- id: tidy-year-totals
  tier: core
  type: write
  skill: td-why
  data: table1
  prompt: "From table1, total cases and total population for each year, then the rate per 10,000 people for the year."
  hint: "Two sums in one summarise(), then a mutate()."
  solution: |
    table1 |>
      summarise(cases = sum(cases), population = sum(population), .by = year) |>
      mutate(rate = cases / population * 10000)

- id: tidy-text-max
  tier: stretch
  type: predict
  skill: td-spot
  data: table3
  prompt: "table3 stores rate as text like \"745/19987071\". After splitting it at the slash, what does this return?"
  code: |
    table3 |>
      separate_wider_delim(rate, delim = "/", names = c("cases", "population")) |>
      summarise(most = max(cases))
  options: ["80488", "213766", "An error: max() needs numbers"]
  verify: 'result$most'
  explain: >-
    The pieces of a split are text, and max() on text compares letter by
    letter: "8" comes after "2", so "80488" beats "213766". Two values in
    one cell hide the numbers' type as well as their meaning.

- id: tidy-growth
  tier: stretch
  type: write
  skill: td-why
  data: table1
  prompt: >-
    From table1, how many times larger was each country's rate in 2000 than
    in 1999? Return country and growth, largest first.
  hint: "Compute the rate, then within each country divide the 2000 rate by the 1999 rate: rate[year == 2000] / rate[year == 1999]."
  solution: |
    table1 |>
      mutate(rate = cases / population) |>
      summarise(growth = rate[year == 2000] / rate[year == 1999], .by = country) |>
      arrange(desc(growth))
  # Half of a 6-row table leaves some countries with one year, so the
  # re-run on a sample cannot work here.
  robust: false

- id: tidy-rate-no-pivot
  tier: brain-melter
  type: constrained
  skill: td-why
  data: table2
  prompt: >-
    From table2, the rate per 10,000 people for each country and year, as
    columns country, year and rate, without any pivot function.
  hint: "Within each country and year there is one cases row and one population row. Pick each out of count with count[type == \"cases\"]."
  solution: |
    table2 |>
      summarise(rate = count[type == "cases"] / count[type == "population"] * 10000,
                .by = c(country, year))
  forbid: ["pivot_wider", "pivot_longer", "spread", "gather"]
  # Half of a 6-row table leaves some countries with one year, so the
  # re-run on a sample cannot work here.
  robust: false
