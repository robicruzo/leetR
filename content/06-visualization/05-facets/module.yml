id: 05-facets
title: "Facets: small multiples"
key_idea: >-
  Facets split one plot into a panel per group, all drawn the same way:
  facet_wrap(~ var) wraps the panels of one variable into rows,
  facet_grid(rows ~ cols) crosses two variables. Panels share their axes
  unless you free them (scales = "free"), which helps seeing shapes but
  makes heights harder to compare. Faceting and colour both split by group:
  facets separate, colour overlays.
subskills:
  - {id: fa-wrap, name: "facet_wrap(~ var): one panel per value"}
  - {id: fa-grid, name: "facet_grid(rows ~ cols): two variables"}
  - {id: fa-scales, name: "scales = \"free\": each panel fits its data"}
  - {id: fa-vs-colour, name: "Facet to separate, colour to overlay"}
readings:
  - {label: "r4ds 9.4, Facets", url: "https://r4ds.hadley.nz/layers.html#facets"}
  - {label: "MDSR 3.1.4, Facets", url: "https://mdsr-book.github.io/mdsr3e/03-common-mistakes.html"}
  - {label: "STAT 7500 primer ch. 4 (ggplot grammar)", url: ""}

predict:
  skill: fa-grid
  code: |
    ggplot(mpg, aes(displ, hwy)) +
      geom_point() +
      facet_grid(drv ~ cyl)
  ask: "mpg has 3 drive types (4, f, r) and 4 cylinder counts (4, 5, 6, 8). How many panels?"
  options:
    - {choice: "12", correct: true}
    - choice: "7"
      misconception: grid-adds
      probe: "A grid crosses rows and columns. 3 rows and 4 columns make how many cells?"
    - choice: "9, only the combinations that occur"
      misconception: grid-drops-empty
      probe: "facet_grid() keeps the grid rectangular. Does it skip a cell just because it is empty?"
  verify: 'nrow(ggplot2::ggplot_build(result)$layout$layout)'

probes:
  - id: p-free-scales
    skill: fa-scales
    ask: "What does facet_wrap(~ species, scales = \"free\") change?"
    options:
      - {choice: "Each panel gets its own x and y ranges", correct: true}
      - choice: "The panels can be in any order"
        misconception: free-is-order
        probe: "\"scales\" is about axes. What does freeing an axis let each panel do?"
      - choice: "Nothing visible; it only speeds up drawing"
        misconception: free-is-technical
        probe: "Would a panel of light penguins look different if its axis started at its own minimum?"
    right_followup: "Are you sure? What do you lose when the axes are free?"
    explain: >-
      Free scales fit each panel to its own data, so shapes inside each group
      are easier to see. But equal heights in two panels no longer mean equal
      values, so comparing across panels gets harder. "free_x" and "free_y"
      free just one axis.
  - id: p-grid-rows
    skill: fa-grid
    ask: "In facet_grid(drv ~ cyl), which variable runs down the rows?"
    options:
      - {choice: "drv", correct: true}
      - choice: "cyl"
        misconception: formula-reversed
        probe: "A formula reads rows ~ columns. Which side of ~ is drv on?"
      - choice: "Both, wrapped like facet_wrap()"
        misconception: grid-is-wrap
        probe: "Does a grid wrap panels, or line them up by two variables?"
    right_followup: "Are you sure? How do you facet by drv in rows only?"
    explain: >-
      facet_grid(rows ~ cols): drv makes the rows, cyl the columns. For rows
      only, write drv ~ . (or rows = vars(drv)); for columns only, . ~ cyl.
